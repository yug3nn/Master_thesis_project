<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fluid Flow Ground Truth (Vortices)</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000000; font-family: Arial, sans-serif; user-select: none; }
        canvas { display: block; }
        
        #ui-panel {
            position: absolute; top: 15px; left: 15px;
            background: rgba(30, 30, 30, 0.85); border: 1px solid #555; border-radius: 8px;
            padding: 15px; color: #fff; z-index: 10; width: 300px;
            transition: opacity 0.3s;
        }
        .hidden { opacity: 0; pointer-events: none; }
        .control-group { margin-bottom: 12px; }
        label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
        input[type="range"] { width: 100%; }
        button { 
            width: 100%; padding: 10px; background: #4CAF50; color: white; 
            border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }
        button:hover { background: #45a049; }
        #instructions { font-size: 12px; color: #aaa; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <h3 style="margin-top: 0; border-bottom: 1px solid #555; padding-bottom: 10px;">Fluid Dynamics Controls</h3>
        
        <div class="control-group">
            <label><span>Particle Count</span> <span id="val-count">200</span></label>
            <input type="range" id="param-count" min="10" max="1500" value="200">
        </div>
        
        <div class="control-group">
            <label><span>Flow Speed</span> <span id="val-speed">3.0</span></label>
            <input type="range" id="param-speed" min="0.5" max="15" step="0.1" value="3.0">
        </div>
        
        <div class="control-group">
            <label><span>Vortex Scale</span> <span id="val-scale">0.005</span></label>
            <input type="range" id="param-scale" min="0.001" max="0.02" step="0.001" value="0.005">
        </div>

        <div class="control-group">
            <label><span>Turbulence (Time)</span> <span id="val-turb">0.002</span></label>
            <input type="range" id="param-turb" min="0" max="0.01" step="0.001" value="0.002">
        </div>

        <div class="control-group">
            <label><span>Particle Radius (px)</span> <span id="val-radius">5</span></label>
            <input type="range" id="param-radius" min="1" max="15" value="5">
        </div>

        <button id="btn-hide">Hide Controls (Start Sync)</button>
        <div id="instructions">Tap anywhere on the black screen to show controls again.</div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const uiPanel = document.getElementById('ui-panel');
        
        const elCount = document.getElementById('param-count');
        const elSpeed = document.getElementById('param-speed');
        const elScale = document.getElementById('param-scale');
        const elTurb = document.getElementById('param-turb');
        const elRadius = document.getElementById('param-radius');
        const btnHide = document.getElementById('btn-hide');

        let particles = [];
        let width, height;
        let time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = 0;
                this.vy = 0;
            }

            update(speed, scale, turb) {
                // Vector field math: generates smooth sweeping curves and vortices
                let angle = Math.sin(this.y * scale + time * turb) + Math.cos(this.x * scale + time * turb);
                
                // Add a constant drift to simulate a general current (e.g., left to right)
                let drift = Math.PI / 4; 
                
                this.vx = Math.cos(angle + drift) * speed;
                this.vy = Math.sin(angle + drift) * speed;

                this.x += this.vx;
                this.y += this.vy;

                // Screen wrapping
                if (this.x > width + 20) this.x = -20;
                else if (this.x < -20) this.x = width + 20;
                if (this.y > height + 20) this.y = -20;
                else if (this.y < -20) this.y = height + 20;
            }

            draw(radius) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = '#FFFFFF';
                ctx.fill();
            }
        }

        function initParticles() {
            const targetCount = parseInt(elCount.value);
            particles = [];
            for (let i = 0; i < targetCount; i++) {
                particles.push(new Particle());
            }
        }

        // Event Listeners
        elCount.addEventListener('input', (e) => {
            document.getElementById('val-count').innerText = e.target.value;
            initParticles();
        });
        elSpeed.addEventListener('input', (e) => document.getElementById('val-speed').innerText = e.target.value);
        elScale.addEventListener('input', (e) => document.getElementById('val-scale').innerText = e.target.value);
        elTurb.addEventListener('input', (e) => document.getElementById('val-turb').innerText = e.target.value);
        elRadius.addEventListener('input', (e) => document.getElementById('val-radius').innerText = e.target.value);

        btnHide.addEventListener('click', (e) => {
            e.stopPropagation();
            uiPanel.classList.add('hidden');
        });

        canvas.addEventListener('click', () => uiPanel.classList.remove('hidden'));

        function animate() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            const speed = parseFloat(elSpeed.value);
            const scale = parseFloat(elScale.value);
            const turb = parseFloat(elTurb.value);
            const radius = parseFloat(elRadius.value);

            particles.forEach(p => {
                p.update(speed, scale, turb);
                p.draw(radius);
            });

            time++;
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();
    </script>
</body>
</html>
